<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e1e4e8" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="white" />
  <rect width="400" height="300" fill="url(#grid)" />

  <g stroke="#24292f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Roller Conveyor -->
    <rect x="20" y="200" width="360" height="40" />
    <line x1="40" y1="200" x2="40" y2="240" stroke="#a0aec0" />
    <line x1="80" y1="200" x2="80" y2="240" stroke="#a0aec0" />
    <line x1="120" y1="200" x2="120" y2="240" stroke="#a0aec0" />
    <line x1="160" y1="200" x2="160" y2="240" stroke="#a0aec0" />
    <line x1="200" y1="200" x2="200" y2="240" stroke="#a0aec0" />
    <line x1="240" y1="200" x2="240" y2="240" stroke="#a0aec0" />
    
    <!-- Box -->
    <rect x="150" y="140" width="80" height="60" fill="white" />
    <line x1="150" y1="140" x2="190" y2="160" /> <!-- Flap 1 -->
    <line x1="230" y1="140" x2="190" y2="160" /> <!-- Flap 2 -->
    
    <!-- Taping Head -->
    <rect x="170" y="80" width="40" height="60" />
    <line x1="190" y1="0" x2="190" y2="80" />
  </g>
  
  <text x="20" y="30" fill="#24292f" font-family="sans-serif" font-weight="bold" font-size="14">FIG 05. PACKING LINE</text>
</svg>
