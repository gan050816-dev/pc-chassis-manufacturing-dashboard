<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e1e4e8" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="white" />
  <rect width="400" height="300" fill="url(#grid)" />

  <g stroke="#24292f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Workbench Table -->
    <rect x="50" y="180" width="300" height="20" /> <!-- Top -->
    <line x1="60" y1="200" x2="60" y2="280" /> <!-- Leg L -->
    <line x1="340" y1="200" x2="340" y2="280" /> <!-- Leg R -->
    <line x1="60" y1="260" x2="340" y2="260" /> <!-- Support -->
    
    <!-- Overhead Gantry -->
    <rect x="150" y="50" width="100" height="130" stroke-dasharray="4 4" stroke="#a0aec0" />
    <line x1="150" y1="50" x2="150" y2="180" stroke="#24292f" />
    <line x1="250" y1="50" x2="250" y2="180" stroke="#24292f" />
    <line x1="150" y1="50" x2="250" y2="50" stroke="#24292f" />

    <!-- Tool Balancer -->
    <line x1="200" y1="50" x2="200" y2="100" />
    <rect x="190" y="100" width="20" height="30" /> 
    <line x1="200" y1="130" x2="200" y2="160" /> <!-- Cable -->
    
    <!-- Smart Tool -->
    <path d="M190 160 L210 160 L210 190 L200 200 L190 190 Z" fill="white"/>
    
    <!-- Part -->
    <rect x="180" y="170" width="40" height="10" fill="#e1e4e8" stroke="none" />
  </g>
  
  <text x="20" y="30" fill="#24292f" font-family="sans-serif" font-weight="bold" font-size="14">FIG 03. ASSEMBLY STATION</text>
</svg>
